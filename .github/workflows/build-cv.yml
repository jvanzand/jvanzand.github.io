# Rebuild cv.pdf from the Overleaf CV project so the site's CV link is always current.
# Runs daily and on demand (Actions tab > "Build CV from Overleaf" > Run workflow;
# tick "force" to rebuild even if the Overleaf CV is unchanged).
# Requires a repository secret OVERLEAF_TOKEN: an Overleaf Git authentication token
# (Overleaf Account Settings > Git Integration). It rebuilds only when the Overleaf
# project has new commits, recorded in .cv-source-commit.
name: Build CV from Overleaf

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the Overleaf CV has not changed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CV source from Overleaf
        id: fetch
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          # Overleaf's Git service sometimes returns 503 ("no healthy upstream") for a
          # while. Try three times, five minutes apart. If it is still down, skip this
          # run with a warning (the next daily run tries again). Authentication errors
          # still fail the run, since they mean OVERLEAF_TOKEN needs replacing.
          for attempt in 1 2 3; do
            if git clone --depth 1 "https://git:${OVERLEAF_TOKEN}@git.overleaf.com/6ab582345e8bd319775a9b81" cv-src 2> clone-error.txt; then
              break
            fi
            cat clone-error.txt
            if grep -qiE "authentication failed|error: (401|403)" clone-error.txt; then
              echo "::error::Overleaf rejected OVERLEAF_TOKEN. Generate a new Git token in Overleaf and update the repository secret."
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "::warning::Overleaf's Git service was unavailable after 3 attempts. Skipping this run; cv.pdf is unchanged."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Clone attempt $attempt failed; retrying in 5 minutes."
            sleep 300
          done
          new=$(git -C cv-src rev-parse HEAD)
          old=$(cat .cv-source-commit 2>/dev/null || true)
          echo "commit=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = "$old" ] && [ "${{ inputs.force }}" != "true" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Compile CV
        if: steps.fetch.outputs.changed == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: cv-src

      - name: Commit updated cv.pdf
        if: steps.fetch.outputs.changed == 'true'
        run: |
          cp cv-src/main.pdf cv.pdf
          echo "${{ steps.fetch.outputs.commit }}" > .cv-source-commit
          # Version tag on the CV link, so browsers don't reuse a cached old PDF.
          sed -i -E "s|const CV_URL = \"cv.pdf[^\"]*\";|const CV_URL = \"cv.pdf?v=${{ steps.fetch.outputs.commit }}\";|" script.js
          sed -i -E "s|(cv.pdf\?v=[0-9a-f]{7})[0-9a-f]*|\1|" script.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf .cv-source-commit script.js
          git diff --cached --quiet || { git commit -m "Update CV from Overleaf"; git push; }
